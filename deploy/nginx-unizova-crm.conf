# NexusCRM under https://unizova.com/crm
# Add these `location` blocks INSIDE your existing `server { listen 443 ssl; server_name unizova.com; ... }`
# block (the one that already serves unizova.com with HTTPS). Then: sudo nginx -t && sudo systemctl reload nginx

# Uploads (attachments) are limited to 10 MB per file, 5 files per request.
client_max_body_size 55m;

# --- API + WebSocket (Socket.IO) -> Node on port 5050. "/crm/api/..." is forwarded as "/api/...".
location /crm/api/ {
    proxy_pass http://127.0.0.1:5050/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # WebSocket upgrade for real-time notifications
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;   # AI Copilot streams can run for a while
    proxy_buffering off;       # stream AI responses (SSE) immediately
}

# --- Built React app (client/dist copied to /var/www/nexuscrm/client)
location = /crm {
    return 301 /crm/;
}

location /crm/assets/ {
    alias /var/www/nexuscrm/client/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

location /crm/ {
    alias /var/www/nexuscrm/client/;
    try_files $uri $uri/ /crm/index.html;
    # index.html and the service worker must never be cached, so deploys show up immediately.
    location = /crm/index.html { alias /var/www/nexuscrm/client/index.html; add_header Cache-Control "no-cache"; }
    location = /crm/sw.js      { alias /var/www/nexuscrm/client/sw.js;      add_header Cache-Control "no-cache"; }
}

# ---------------------------------------------------------------------------------------------
# ALSO REQUIRED once, in the `http { ... }` block (e.g. /etc/nginx/conf.d/websocket-map.conf):
#
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }
